[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-shellcraft"
version = "0.1.0"
description = "Rails-style console ergonomics for Django — pretty printing, model shortcuts, and schema inspection"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [
  { name = "Siva", email = "sivanandam03@gmail.com" }
]
keywords = [
  "django",
  "shell",
  "console",
  "rails",
  "orm",
  "developer-tools"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Django",
  "Framework :: Django :: 3.2",
  "Framework :: Django :: 4.0",
  "Framework :: Django :: 4.1",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.0",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "django>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-django",
  "ruff",
]

[tool.ruff]
target-version = "py38"
line-length = 88

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "RET",  # flake8-return
]

[tool.ruff.lint.per-file-ignores]
# Deferred imports are intentional in management commands (avoid circular
# deps; only load IPython/shellcraft internals when the command runs).
"shellcraft/management/**" = ["PLC0415"]
# DTZ (naive-datetime) is fine in tests that don't touch real datetimes.
"tests/**" = ["DTZ"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["shellcraft"]

[project.urls]
# Homepage = "https://github.com/yourusername/django-shellcraft"
# Issues = "https://github.com/yourusername/django-shellcraft/issues"
